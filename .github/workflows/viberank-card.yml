name: Viberank Card

# viberank는 README용 배지/임베드를 공식 제공하지 않는다.
# (share 기능은 프로필 URL 복사와 X 공유 인텐트뿐이다.)
#
# 다만 프로필 페이지의 og:image가 /api/og?type=profile&... 을 가리키는데,
# 랭크·비용·토큰·활동일·스트릭·16주 히트맵이 전부 쿼리 파라미터로 박힌
# 완성된 1200x630 카드다. 즉 그 URL만 최신으로 갈아끼우면 자동 갱신 배지가 된다.
#
# URL 끝의 v=cost-days-rank 는 내용 지문이라 값이 안 바뀌면 URL도 동일하다
# → diff가 없어 커밋도 안 생긴다. 제출 없는 날은 조용히 넘어간다.

on:
  schedule:
    # 매일 KST 09:20 (UTC 00:20)
    # - waka-readme가 09:00에 같은 README를 커밋하므로 20분 비켜둔다
    # - 정각은 Actions 러너가 붐벼 수십 분씩 밀린다
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    name: Update README with viberank card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update card URL in README
        run: |
          USERNAME="WhorideChicken"

          # 프로필 페이지를 받아 og:image를 뽑는다.
          if ! curl -sSL -m 60 -o /tmp/profile.html \
                 "https://viberank.app/profile/${USERNAME}"; then
            echo "::warning::프로필 페이지를 가져오지 못했다. 다음 실행에서 재시도된다."
            exit 0
          fi

          python3 - "$USERNAME" <<'PY'
          import html, pathlib, re, sys

          username = sys.argv[1]
          page = pathlib.Path("/tmp/profile.html").read_text(encoding="utf-8", errors="replace")

          m = re.search(r'<meta\s+property="og:image"\s+content="([^"]+)"', page)
          if not m:
              # 사이트 구조가 바뀐 경우. README를 망가뜨리지 않고 그냥 넘어간다.
              print("::warning::og:image 메타 태그를 찾지 못했다. viberank 쪽 마크업이 바뀌었을 수 있다.")
              sys.exit(0)

          url = html.unescape(m.group(1))

          # 엉뚱한 응답(로그인 페이지, 에러 페이지 등)을 심지 않도록 확인한다.
          if "/api/og" not in url or "type=profile" not in url:
              print(f"::warning::프로필 카드 URL이 아니다: {url}")
              sys.exit(0)

          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          block = (
              "<!--START_SECTION:viberank-->\n"
              f'<a href="https://viberank.app/profile/{username}">'
              f'<img src="{url}" width="480" alt="{username} on Viberank" /></a>\n'
              "<!--END_SECTION:viberank-->"
          )

          new_text, count = re.subn(
              r"<!--START_SECTION:viberank-->.*?<!--END_SECTION:viberank-->",
              lambda _: block,  # URL 속 백슬래시/그룹 참조가 치환에 먹히지 않도록 함수로 넘긴다
              text,
              flags=re.DOTALL,
          )

          if count == 0:
              print("::warning::README에서 viberank 마커를 찾지 못했다.")
              sys.exit(0)

          if new_text == text:
              print("카드 내용에 변화 없음 — 커밋할 것이 없다.")
              sys.exit(0)

          readme.write_text(new_text, encoding="utf-8")
          print(f"카드 URL 갱신됨: {url}")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "변경 없음. 종료한다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update viberank card"

          # waka-readme가 같은 파일을 건드리므로 밀어넣기 전에 최신을 당겨온다.
          git pull --rebase origin main
          git push
